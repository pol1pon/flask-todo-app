name: Flask CI Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build-and-test:
    runs-on: ubuntu-22.04

    env:
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/application:${{ github.workspace }}/application/controllers:${{ github.workspace }}/application/models:${{ github.workspace }}/application/extensions

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir -r requirements.txt
          python -c "import site; p = site.getsitepackages()[0]; open(f'{p}/sitecustomize.py', 'w').write('import time\nif not hasattr(time, \"clock\"):\n    time.clock = time.perf_counter\n')"

      - name: Validate Python syntax
        run: |
          python -m compileall .

      - name: Initialize SQLite database
        run: |
          python -c "from application import create_app; from application.extensions import db; app = create_app(); app.app_context().push(); db.create_all()"

      - name: Smoke test Flask server
        run: |
          python manage.py runserver -h 0.0.0.0 -p 7345 -R &
          SERVER_PID=$!
          for i in $(seq 1 15); do
            if curl -s -f -I http://127.0.0.1:7345 > /dev/null 2>&1; then
              echo "Server is ready on port 7345"
              break
            fi
            sleep 1
          done
          curl -f -I http://127.0.0.1:7345
          kill $SERVER_PID

  docker-build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t flask-todo-app:ci .

      - name: Run container
        run: |
          docker run -d -p 7345:7345 --name test-todo-app flask-todo-app:ci

      - name: Smoke test Docker container
        run: |
          for i in $(seq 1 15); do
            if curl -s -f -I http://127.0.0.1:7345 > /dev/null 2>&1; then
              echo "Docker container server is ready on port 7345"
              break
            fi
            sleep 1
          done
          curl -f -I http://127.0.0.1:7345
